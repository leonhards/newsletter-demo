<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 490">
  <defs>
    <marker id="ah" markerWidth="7" markerHeight="6" refX="6" refY="3" orient="auto">
      <polygon points="0 0,7 3,0 6" fill="rgba(255,255,255,0.8)"/>
    </marker>
    <marker id="ah-gold" markerWidth="7" markerHeight="6" refX="6" refY="3" orient="auto">
      <polygon points="0 0,7 3,0 6" fill="#F59E0B"/>
    </marker>
    <style>
      @keyframes flow {
        from { stroke-dashoffset: 16; }
        to   { stroke-dashoffset: 0; }
      }
      .arrow {
        fill: none;
        stroke: rgba(255,255,255,0.65);
        stroke-width: 2;
        stroke-dasharray: 8 8;
        marker-end: url(#ah);
        animation: flow 1s linear infinite;
      }
      .arrow-gold {
        fill: none;
        stroke: #F59E0B;
        stroke-width: 2;
        stroke-dasharray: 8 8;
        marker-end: url(#ah-gold);
        animation: flow 1s linear infinite;
      }
      .node       { fill: #1E2535; stroke: rgba(255,255,255,0.55); stroke-width: 1.5; }
      .node-end   { fill: #0D1020; stroke: rgba(255,255,255,0.6);  stroke-width: 2.5; }
      .lbl        { fill: #fff; font-family: Arial,sans-serif; font-size: 12px; font-weight: 600; text-anchor: middle; }
      .sub        { fill: rgba(255,255,255,0.4); font-family: Arial,sans-serif; font-size: 9.5px; text-anchor: middle; }
      .hlbl       { fill: #fff; font-family: Arial,sans-serif; font-size: 10.5px; font-weight: bold; text-anchor: middle; letter-spacing: 1; }
      .albl       { fill: rgba(255,255,255,0.45); font-family: Arial,sans-serif; font-size: 9px; text-anchor: middle; }
      .sep        { stroke: rgba(255,255,255,0.12); stroke-width: 1; stroke-dasharray: 6 5; }
    </style>
  </defs>

  <!-- ── Lane backgrounds ── -->
  <rect width="1120" height="490" fill="#0D1020"/>
  <rect x="0" y="0"   width="1120" height="155" fill="#18110a"/>
  <rect x="0" y="155" width="1120" height="165" fill="#0d0d20"/>
  <rect x="0" y="320" width="1120" height="170" fill="#071820"/>

  <!-- Lane separators -->
  <line class="sep" x1="40" y1="155" x2="1120" y2="155"/>
  <line class="sep" x1="40" y1="320" x2="1120" y2="320"/>

  <!-- ── Lane headers ── -->
  <rect x="0" y="0"   width="40" height="155" fill="#92400E"/>
  <text class="hlbl" transform="translate(20,77) rotate(-90)">USER</text>

  <rect x="0" y="155" width="40" height="165" fill="#3730A3"/>
  <text class="hlbl" transform="translate(20,237) rotate(-90)">CLAUDE AGENT</text>

  <rect x="0" y="320" width="40" height="170" fill="#0E7490"/>
  <text class="hlbl" transform="translate(20,405) rotate(-90)">TOOLS &amp; APIs</text>

  <!-- ════════════════════════════
       NODES
       ════════════════════════════ -->

  <!-- Lane 1 · User · y=77 -->
  <!-- Start -->
  <circle class="node-end" cx="190" cy="77" r="22"/>
  <circle cx="190" cy="77" r="9" fill="rgba(255,255,255,0.7)"/>
  <text class="sub" x="190" y="112">Need topic</text>

  <!-- End -->
  <circle class="node-end" cx="1045" cy="77" r="22"/>
  <circle cx="1045" cy="77" r="13" fill="none" stroke="rgba(255,255,255,0.7)" stroke-width="3.5"/>
  <circle cx="1045" cy="77"  r="7"  fill="rgba(255,255,255,0.7)"/>
  <text class="sub" x="1045" y="112">Email received</text>

  <!-- Lane 2 · Claude Agent · y=237 -->
  <!-- Compose Queries box  cx=360 -->
  <rect class="node" x="295" y="213" width="130" height="48" rx="8"/>
  <text class="lbl" x="360" y="232">Compose</text>
  <text class="lbl" x="360" y="249">Queries</text>
  <text class="sub" x="360" y="270">Claude Code</text>

  <!-- Generate Content box  cx=535 -->
  <rect class="node" x="470" y="213" width="130" height="48" rx="8"/>
  <text class="lbl" x="535" y="232">Generate</text>
  <text class="lbl" x="535" y="249">Content</text>
  <text class="sub" x="535" y="270">Claude Code</text>

  <!-- Lane 3 · Tools & APIs · y=405 -->
  <!-- Tavily Search  cx=360 -->
  <rect class="node" x="295" y="381" width="130" height="48" rx="8"/>
  <text class="lbl" x="360" y="409">Tavily Search</text>
  <text class="sub" x="360" y="439">Tavily API</text>

  <!-- kie.ai Images  cx=535 -->
  <rect class="node" x="470" y="381" width="130" height="48" rx="8"/>
  <text class="lbl" x="535" y="409">kie.ai Images</text>
  <text class="sub" x="535" y="439">kie.ai API</text>

  <!-- Drive Upload  cx=705 -->
  <rect class="node" x="640" y="381" width="130" height="48" rx="8"/>
  <text class="lbl" x="705" y="398">Drive</text>
  <text class="lbl" x="705" y="415">Upload</text>
  <text class="sub" x="705" y="439">Google Drive</text>

  <!-- Render HTML  cx=875 -->
  <rect class="node" x="810" y="381" width="130" height="48" rx="8"/>
  <text class="lbl" x="875" y="398">Render</text>
  <text class="lbl" x="875" y="415">HTML</text>
  <text class="sub" x="875" y="439">Jinja2 + premailer</text>

  <!-- Gmail Send  cx=1045 -->
  <rect class="node" x="980" y="381" width="130" height="48" rx="8"/>
  <text class="lbl" x="1045" y="409">Gmail Send</text>
  <text class="sub" x="1045" y="439">Gmail API</text>

  <!-- ════════════════════════════
       ANIMATED ARROWS
       ════════════════════════════ -->

  <!-- 1 · Start → Compose Queries  (gold: User → Agent) -->
  <path class="arrow-gold" d="M190,99 V213 H295"/>
  <text class="albl" x="240" y="207">Topic</text>

  <!-- 2 · Compose Queries → Tavily Search  (Agent → Tool) -->
  <path class="arrow" d="M360,261 V381"/>

  <!-- 3 · Tavily Search → Generate Content  (results go back up) -->
  <path class="arrow" d="M425,405 H450 V237 H470"/>
  <text class="albl" x="463" y="315">Research results</text>

  <!-- 4 · Generate Content → kie.ai  (Agent → Tool) -->
  <path class="arrow" d="M535,261 V381"/>

  <!-- 5 · kie.ai → Drive Upload  (within Tools lane) -->
  <path class="arrow" d="M600,405 H640"/>

  <!-- 6 · Drive Upload → Render HTML  (within Tools lane) -->
  <path class="arrow" d="M770,405 H810"/>

  <!-- 7 · Render HTML → Gmail Send  (within Tools lane) -->
  <path class="arrow" d="M940,405 H980"/>

  <!-- 8 · Gmail Send → End  (gold: Tool → User) -->
  <path class="arrow-gold" d="M1045,381 V99"/>
  <text class="albl" x="1058" y="240">Newsletter</text>
</svg>
