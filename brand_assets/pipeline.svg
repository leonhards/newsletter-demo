<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 170">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0D1020"/>
      <stop offset="100%" stop-color="#1A1F35"/>
    </linearGradient>
    <linearGradient id="box" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3F3DA8"/>
      <stop offset="100%" stop-color="#8786F4"/>
    </linearGradient>
    <linearGradient id="boxEnd" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0891B2"/>
      <stop offset="100%" stop-color="#22D3EE"/>
    </linearGradient>
    <marker id="arr" markerWidth="7" markerHeight="6" refX="6" refY="3" orient="auto">
      <polygon points="0 0, 7 3, 0 6" fill="#22D3EE"/>
    </marker>
    <style>
      @keyframes fadeUp {
        from { opacity: 0; transform: translateY(6px); }
        to   { opacity: 1; transform: translateY(0); }
      }
      @keyframes drawArrow {
        from { stroke-dashoffset: 42; }
        to   { stroke-dashoffset: 0; }
      }
      @keyframes flowOn {
        to { opacity: 0.55; }
      }
      @keyframes flowMove {
        from { stroke-dashoffset: 9; }
        to   { stroke-dashoffset: 0; }
      }
      @keyframes pulse {
        0%, 100% { opacity: 1; }
        50%      { opacity: 0.7; }
      }

      .step { opacity: 0; animation: fadeUp .45s ease forwards; }
      .arr  { stroke-dasharray: 42; stroke-dashoffset: 42; animation: drawArrow .35s ease forwards; }
      .flow { opacity: 0; stroke-dasharray: 5 4;
              animation: flowOn .01s ease forwards, flowMove 1.1s linear infinite; }

      .s1 { animation-delay: .1s; }
      .s2 { animation-delay: .65s; }
      .s3 { animation-delay: 1.2s; }
      .s4 { animation-delay: 1.75s; }
      .s5 { animation-delay: 2.3s; }
      .s6 { animation-delay: 2.85s; }
      .s7 { animation-delay: 3.4s; animation-name: fadeUp, pulse; animation-duration: .45s, 2s; animation-timing-function: ease, ease-in-out; animation-iteration-count: 1, infinite; animation-fill-mode: forwards, none; animation-delay: 3.4s, 4.2s; }

      .a1 { animation-delay: .55s; }  .f1 { animation-delay: .9s; }
      .a2 { animation-delay: 1.1s; }  .f2 { animation-delay: 1.45s; }
      .a3 { animation-delay: 1.65s; } .f3 { animation-delay: 2.0s; }
      .a4 { animation-delay: 2.2s; }  .f4 { animation-delay: 2.55s; }
      .a5 { animation-delay: 2.75s; } .f5 { animation-delay: 3.1s; }
      .a6 { animation-delay: 3.3s; }  .f6 { animation-delay: 3.65s; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1100" height="170" rx="14" fill="url(#bg)"/>

  <!-- Title -->
  <text x="550" y="30" fill="#A78BFA" font-family="Arial,sans-serif" font-size="13" font-weight="bold" text-anchor="middle" letter-spacing="2">NEWSLETTER PIPELINE</text>

  <!-- ── Box 1: Topic ── x=20 cx=75 -->
  <g class="step s1">
    <rect x="20" y="55" width="110" height="58" rx="8" fill="url(#box)"/>
    <text x="75" y="80" fill="#fff" font-family="Arial,sans-serif" font-size="12" font-weight="bold" text-anchor="middle">Topic</text>
    <text x="75" y="98" fill="#22D3EE" font-family="Arial,sans-serif" font-size="10" text-anchor="middle">Input</text>
    <text x="75" y="128" fill="#4A5568" font-family="Arial,sans-serif" font-size="9" text-anchor="middle">Step 0</text>
  </g>

  <!-- Arrow 1 → 2 -->
  <path class="arr a1" d="M133,84 L173,84" stroke="#22D3EE" stroke-width="2" fill="none" marker-end="url(#arr)"/>
  <path class="flow f1" d="M133,84 L173,84" stroke="#22D3EE" stroke-width="1.5" fill="none"/>

  <!-- ── Box 2: Research ── x=178 cx=233 -->
  <g class="step s2">
    <rect x="178" y="55" width="110" height="58" rx="8" fill="url(#box)"/>
    <text x="233" y="80" fill="#fff" font-family="Arial,sans-serif" font-size="12" font-weight="bold" text-anchor="middle">Research</text>
    <text x="233" y="98" fill="#22D3EE" font-family="Arial,sans-serif" font-size="10" text-anchor="middle">Tavily</text>
    <text x="233" y="128" fill="#4A5568" font-family="Arial,sans-serif" font-size="9" text-anchor="middle">Step 1</text>
  </g>

  <!-- Arrow 2 → 3 -->
  <path class="arr a2" d="M291,84 L331,84" stroke="#22D3EE" stroke-width="2" fill="none" marker-end="url(#arr)"/>
  <path class="flow f2" d="M291,84 L331,84" stroke="#22D3EE" stroke-width="1.5" fill="none"/>

  <!-- ── Box 3: Content ── x=336 cx=391 -->
  <g class="step s3">
    <rect x="336" y="55" width="110" height="58" rx="8" fill="url(#box)"/>
    <text x="391" y="80" fill="#fff" font-family="Arial,sans-serif" font-size="12" font-weight="bold" text-anchor="middle">Content</text>
    <text x="391" y="98" fill="#22D3EE" font-family="Arial,sans-serif" font-size="10" text-anchor="middle">Claude</text>
    <text x="391" y="128" fill="#4A5568" font-family="Arial,sans-serif" font-size="9" text-anchor="middle">Step 2</text>
  </g>

  <!-- Arrow 3 → 4 -->
  <path class="arr a3" d="M449,84 L489,84" stroke="#22D3EE" stroke-width="2" fill="none" marker-end="url(#arr)"/>
  <path class="flow f3" d="M449,84 L489,84" stroke="#22D3EE" stroke-width="1.5" fill="none"/>

  <!-- ── Box 4: Images ── x=494 cx=549 -->
  <g class="step s4">
    <rect x="494" y="55" width="110" height="58" rx="8" fill="url(#box)"/>
    <text x="549" y="80" fill="#fff" font-family="Arial,sans-serif" font-size="12" font-weight="bold" text-anchor="middle">Images</text>
    <text x="549" y="98" fill="#22D3EE" font-family="Arial,sans-serif" font-size="10" text-anchor="middle">kie.ai</text>
    <text x="549" y="128" fill="#4A5568" font-family="Arial,sans-serif" font-size="9" text-anchor="middle">Step 3</text>
  </g>

  <!-- Arrow 4 → 5 -->
  <path class="arr a4" d="M607,84 L647,84" stroke="#22D3EE" stroke-width="2" fill="none" marker-end="url(#arr)"/>
  <path class="flow f4" d="M607,84 L647,84" stroke="#22D3EE" stroke-width="1.5" fill="none"/>

  <!-- ── Box 5: Upload ── x=652 cx=707 -->
  <g class="step s5">
    <rect x="652" y="55" width="110" height="58" rx="8" fill="url(#box)"/>
    <text x="707" y="80" fill="#fff" font-family="Arial,sans-serif" font-size="12" font-weight="bold" text-anchor="middle">Upload</text>
    <text x="707" y="98" fill="#22D3EE" font-family="Arial,sans-serif" font-size="10" text-anchor="middle">Google Drive</text>
    <text x="707" y="128" fill="#4A5568" font-family="Arial,sans-serif" font-size="9" text-anchor="middle">Step 4</text>
  </g>

  <!-- Arrow 5 → 6 -->
  <path class="arr a5" d="M765,84 L805,84" stroke="#22D3EE" stroke-width="2" fill="none" marker-end="url(#arr)"/>
  <path class="flow f5" d="M765,84 L805,84" stroke="#22D3EE" stroke-width="1.5" fill="none"/>

  <!-- ── Box 6: Render ── x=810 cx=865 -->
  <g class="step s6">
    <rect x="810" y="55" width="110" height="58" rx="8" fill="url(#box)"/>
    <text x="865" y="80" fill="#fff" font-family="Arial,sans-serif" font-size="12" font-weight="bold" text-anchor="middle">Render</text>
    <text x="865" y="98" fill="#22D3EE" font-family="Arial,sans-serif" font-size="10" text-anchor="middle">HTML</text>
    <text x="865" y="128" fill="#4A5568" font-family="Arial,sans-serif" font-size="9" text-anchor="middle">Step 5</text>
  </g>

  <!-- Arrow 6 → 7 -->
  <path class="arr a6" d="M923,84 L963,84" stroke="#22D3EE" stroke-width="2" fill="none" marker-end="url(#arr)"/>
  <path class="flow f6" d="M923,84 L963,84" stroke="#22D3EE" stroke-width="1.5" fill="none"/>

  <!-- ── Box 7: Send ── x=968 cx=1023 -->
  <g class="step s7">
    <rect x="968" y="55" width="110" height="58" rx="8" fill="url(#boxEnd)"/>
    <text x="1023" y="80" fill="#fff" font-family="Arial,sans-serif" font-size="12" font-weight="bold" text-anchor="middle">Send</text>
    <text x="1023" y="98" fill="#0D1020" font-family="Arial,sans-serif" font-size="10" font-weight="bold" text-anchor="middle">Gmail</text>
    <text x="1023" y="128" fill="#4A5568" font-family="Arial,sans-serif" font-size="9" text-anchor="middle">Step 6</text>
  </g>
</svg>
